{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card mt-5">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-building" style="font-size: 2.5rem; color:#1F4E5F;"></i>
          <h4 class="mt-2 mb-0">SIGEPAT</h4>
          <small class="text-muted">Gestión y control de bienes patrimoniales</small>
        </div>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            {{ form.password }}
          </div>
          {% if form.non_field_errors %}
            <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
          {% endif %}
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
