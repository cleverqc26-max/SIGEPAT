{% extends "base.html" %}
{% block titulo %}Abrir inventario{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card"><div class="card-body p-4">
      <h5>Abrir inventario físico</h5>
      <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Abrir inventario</button>
        <a href="{% url 'inventario:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
